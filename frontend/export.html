<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NextGenKPI – Export CSV</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NextGen<span class="text-info">KPI</span></a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="index.html">Tableau de bord</a>
        <a class="nav-link" href="config.html">Configuration</a>
        <a class="nav-link active" href="export.html">Export CSV</a>
      </div>
      <span id="statut-api" class="badge bg-secondary">API…</span>
    </div>
  </nav>

  <main class="container pb-5" style="max-width: 720px">
    <div id="messages"></div>
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4 mb-3">Export des données historiques</h1>
        <form id="form-export" class="row g-3">
          <div class="col-12"><label class="form-label">Variable</label>
            <select id="e-variable" class="form-select"></select></div>
          <div class="col-md-6"><label class="form-label">Du</label>
            <input id="e-debut" type="datetime-local" class="form-control" required /></div>
          <div class="col-md-6"><label class="form-label">Au</label>
            <input id="e-fin" type="datetime-local" class="form-control" required /></div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Télécharger le CSV</button>
          </div>
        </form>
        <p class="text-muted small mt-3 mb-0">Format compatible Excel (séparateur « ; », heure de Paris).</p>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/export.js"></script>
</body>
</html>
