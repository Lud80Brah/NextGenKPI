<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NextGenKPI – Configuration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/style.css" rel="stylesheet" />
</head>
<body>
  <nav class="navbar navbar-expand navbar-dark bg-dark mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">NextGen<span class="text-info">KPI</span></a>
      <div class="navbar-nav me-auto">
        <a class="nav-link" href="index.html">Tableau de bord</a>
        <a class="nav-link active" href="config.html">Configuration</a>
        <a class="nav-link" href="export.html">Export CSV</a>
      </div>
      <span id="statut-api" class="badge bg-secondary">API…</span>
    </div>
  </nav>

  <main class="container pb-5">
    <div id="messages"></div>

    <!-- ===================== AUTOMATES ===================== -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h4 mb-3">Automates</h2>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>Nom</th><th>Adresse IP</th><th>Port</th><th>Unit ID</th><th></th></tr></thead>
            <tbody id="table-automates"></tbody>
          </table>
        </div>

        <h3 class="h6 mt-3" id="titre-form-automate">Ajouter un automate</h3>
        <form id="form-automate" class="row g-2">
          <input type="hidden" id="a-id" />
          <div class="col-md-3"><input id="a-nom" class="form-control" placeholder="Nom" required /></div>
          <div class="col-md-3"><input id="a-ip" class="form-control" placeholder="Adresse IP (ex : 192.168.0.10)" required /></div>
          <div class="col-md-2"><input id="a-port" type="number" class="form-control" value="502" min="1" max="65535" title="Port" /></div>
          <div class="col-md-1"><input id="a-unit" type="number" class="form-control" value="1" min="0" max="255" title="Unit ID" /></div>
          <div class="col-md-3"><input id="a-description" class="form-control" placeholder="Description (optionnel)" /></div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Enregistrer</button>
            <button class="btn btn-outline-secondary" type="button" id="annuler-automate">Annuler</button>
          </div>
        </form>
      </div>
    </div>

    <!-- ===================== VARIABLES ===================== -->
    <div class="card shadow-sm">
      <div class="card-body">
        <h2 class="h4 mb-3">Variables surveillées</h2>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>Nom</th><th>Automate</th><th>Registre</th><th>Type</th><th>Échelle</th>
              <th>Unité</th><th>Fréquence</th><th>État</th><th></th></tr></thead>
            <tbody id="table-variables"></tbody>
          </table>
        </div>

        <h3 class="h6 mt-3" id="titre-form-variable">Ajouter une variable</h3>
        <form id="form-variable" class="row g-2">
          <input type="hidden" id="v-id" />
          <div class="col-md-3"><label class="form-label small">Automate</label>
            <select id="v-automate" class="form-select" required></select></div>
          <div class="col-md-3"><label class="form-label small">Nom</label>
            <input id="v-nom" class="form-control" placeholder="Ex : Température four" required /></div>
          <div class="col-md-2"><label class="form-label small">Type de registre</label>
            <select id="v-registre" class="form-select">
              <option value="holding">Holding register</option>
              <option value="input">Input register</option>
              <option value="coil">Coil</option>
              <option value="discrete">Discrete input</option>
            </select></div>
          <div class="col-md-2"><label class="form-label small">Adresse</label>
            <input id="v-adresse" type="number" class="form-control" min="0" max="65535" required /></div>
          <div class="col-md-2"><label class="form-label small">Type de donnée</label>
            <select id="v-type" class="form-select">
              <option value="int16">int16</option>
              <option value="uint16">uint16</option>
              <option value="float32">float32</option>
              <option value="bool">bool</option>
            </select></div>
          <div class="col-md-2"><label class="form-label small">Facteur d'échelle</label>
            <input id="v-facteur" type="number" step="any" class="form-control" value="1" /></div>
          <div class="col-md-2"><label class="form-label small">Unité</label>
            <input id="v-unite" class="form-control" placeholder="°C, bar…" /></div>
          <div class="col-md-2"><label class="form-label small">Fréquence (s)</label>
            <input id="v-frequence" type="number" class="form-control" value="5" min="1" required /></div>
          <div class="col-md-2 d-flex align-items-end">
            <div class="form-check mb-2">
              <input id="v-actif" type="checkbox" class="form-check-input" checked />
              <label for="v-actif" class="form-check-label">Active</label>
            </div></div>
          <div class="col-12">
            <button class="btn btn-primary" type="submit">Enregistrer</button>
            <button class="btn btn-outline-secondary" type="button" id="annuler-variable">Annuler</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/config.js"></script>
</body>
</html>
